name: Validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lps
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lps
        ports: ["5432:5432"]
        options: --health-cmd 'pg_isready -U lps' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lps:ci-only@localhost:5432/lps
      APP_URL: http://localhost:3000
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contracts
      - run: npm run build
